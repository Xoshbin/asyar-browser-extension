<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Solid Flat Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#2563EB" />

  <!-- Calibrated Glyph (~19% Optical Margin Sweet-Spot) -->
  <g transform="translate(-30.72 -30.72) scale(1.12)">

<g filter="url(#shadow)">
    <!-- Orbital Globe Rings -->
    <ellipse cx="256" cy="270" rx="150" ry="52" fill="none" stroke="#93C5FD" stroke-width="5" stroke-opacity="0.4" transform="rotate(-22 256 270)"/>
    <ellipse cx="256" cy="270" rx="150" ry="52" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-dasharray="140 300" stroke-opacity="0.8" transform="rotate(-22 256 270)"/>

    <!-- Frosted Browser Window Card -->
    <rect x="136" y="156" width="240" height="184" rx="20" fill="#FFFFFF"/>
    <!-- Window Header -->
    <path d="M 136, 176 C 136, 165 145, 156 156, 156 L 356, 156 C 367, 156 376, 165 376, 176 L 376, 196 L 136, 196 Z" fill="#F1F5F9"/>
    <!-- Traffic lights -->
    <circle cx="158" cy="176" r="5" fill="#EF4444"/>
    <circle cx="174" cy="176" r="5" fill="#F59E0B"/>
    <circle cx="190" cy="176" r="5" fill="#10B981"/>
    <!-- URL Pill -->
    <rect x="210" y="167" width="148" height="18" rx="9" fill="#E2E8F0"/>
    <circle cx="220" cy="176" r="3.5" fill="#94A3B8"/>
    <!-- Search Bar Indicator -->
    <line x1="228" y1="176" x2="265" y2="176" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Content area: Compass / Planet Center -->
    <circle cx="256" cy="265" r="42" fill="#EFF6FF"/>
    <circle cx="256" cy="265" r="42" fill="none" stroke="#3B82F6" stroke-width="3" stroke-opacity="0.3"/>
    <!-- Compass Pointer (North / South) -->
    <polygon points="256,236 266,265 256,261" fill="#2563EB"/>
    <polygon points="256,236 246,265 256,261" fill="#3B82F6"/>
    <polygon points="256,294 266,265 256,269" fill="#94A3B8"/>
    <polygon points="256,294 246,265 256,269" fill="#CBD5E1"/>
    <circle cx="256" cy="265" r="4" fill="#FFFFFF"/>
  </g>
  </g>

  <!-- 2px Specular Rim Stroke -->
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2" />
</svg>